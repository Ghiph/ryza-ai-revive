name: Build Ryza Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Ryza source
        shell: bash
        run: |
          set -e

          echo "Checking Ryza source..."

          test -f web/index.html
          test -f web/js/app.js
          test -f web/js/api.js
          test -f web/js/config.js

          test -f web/assets/_index/scenes.json
          test -f web/assets/_index/voice_bank.json
          test -f web/assets/_index/world_hierarchy.json

          echo "Ryza web assets found."

      - name: Verify Fish Audio support
        shell: bash
        run: |
          set -e

          grep -qi "fish" web/js/app.js
          grep -qi "fishaudio" web/js/api.js
          grep -qi "fishaudio-s21pro-flash" web/js/config.js

          echo "Fish Audio support found."

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          grep -q 'applicationId "com.ryza.chat.fish"' android/app/build.gradle
          grep -q 'assets.srcDirs = \["../../web"\]' android/app/build.gradle

          echo "Android configuration is correct."

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created:"
          ls -lh "$APK"

          echo ""
          echo "Checking APK assets..."

          unzip -l "$APK" | grep -F "assets/index.html"
          unzip -l "$APK" | grep -F "assets/js/app.js"
          unzip -l "$APK" | grep -F "assets/js/api.js"
          unzip -l "$APK" | grep -F "assets/js/config.js"
          unzip -l "$APK" | grep -F "assets/assets/_index/scenes.json"
          unzip -l "$APK" | grep -F "assets/assets/_index/voice_bank.json"
          unzip -l "$APK" | grep -F "assets/assets/_index/world_hierarchy.json"

          echo ""
          echo "Checking Fish Audio code..."

          unzip -p "$APK" assets/js/app.js | grep -qi "fish"
          unzip -p "$APK" assets/js/api.js | grep -qi "fishaudio"

          echo ""
          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-1.2.15-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
