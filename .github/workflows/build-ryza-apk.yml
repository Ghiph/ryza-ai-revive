name: Build Ryza Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Ryza source
        shell: bash
        run: |
          set -e

          echo "Checking required Ryza source files..."

          test -f web/index.html
          test -f web/js/app.js
          test -f web/js/api.js
          test -f web/js/config.js

          test -f web/assets/_index/scenes.json
          test -f web/assets/_index/voice_bank.json
          test -f web/assets/_index/world_hierarchy.json

          test -f scripts/pack_apk_assets.py

          echo "All required source files are present."

      - name: Verify Fish Audio source
        shell: bash
        run: |
          set -e

          grep -qi "fish" web/js/app.js
          grep -qi "fishaudio" web/js/api.js
          grep -qi "fishaudio-s21pro-flash" web/js/config.js

          echo "Fish Audio support detected."

      - name: Prepare Android build
        shell: bash
        run: |
          set -e

          # The Ryza Android project has its own asset packer.
          # Gradle should build the native shell only.
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets

          echo "Android build directory prepared."

      - name: Build Android APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Pack Ryza web assets into APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Packing web assets..."

          python3 scripts/pack_apk_assets.py "$APK" web

          echo "Web assets packed."

      - name: Verify APK contents
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "APK size:"
          du -h "$APK"

          echo ""
          echo "Checking required APK assets..."

          unzip -l "$APK" | grep -F "assets/index.html"
          unzip -l "$APK" | grep -F "assets/js/app.js"
          unzip -l "$APK" | grep -F "assets/js/api.js"
          unzip -l "$APK" | grep -F "assets/js/config.js"

          unzip -l "$APK" | grep -F "assets/assets/_index/scenes.json"
          unzip -l "$APK" | grep -F "assets/assets/_index/voice_bank.json"
          unzip -l "$APK" | grep -F "assets/assets/_index/world_hierarchy.json"

          echo ""
          echo "Checking Fish Audio code..."

          unzip -p "$APK" assets/js/api.js | grep -qi "fishaudio"
          unzip -p "$APK" assets/js/app.js | grep -qi "fish"

          echo ""
          echo "APK verification PASSED."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-1.2.15-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
