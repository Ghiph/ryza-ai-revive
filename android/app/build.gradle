plugins {
    id "com.android.application"
}

android {
    namespace "com.ryza.chat"
    compileSdk 34

    defaultConfig {
        applicationId "com.ryza.chat.fish"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.2.15"
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
        }
    }

    /*
     * IMPORTANT:
     *
     * AAPT normally ignores directories beginning with "_".
     * Ryza requires:
     *
     * assets/_index/
     *
     * so we must override the default ignore pattern.
     */
    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    packaging {
        resources.excludes += "**/*.md"
    }
}
